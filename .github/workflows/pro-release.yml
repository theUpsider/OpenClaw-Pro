# OpenClaw Pro release pipeline.
#
# Purpose: on every merge to `pro/main`, cut a GitHub Release and publish the
# runtime image to GHCR; also rebuild and republish the `latest` image weekly.
# Pull requests that touch this file run the same pipeline in `proof` mode,
# which performs a full dry Docker build (no push) so the pipeline is exercised
# before merge; publishing only starts after the merge.
#
# GitHub-hosted runners only. Authentication is the workflow GITHUB_TOKEN;
# no additional secrets are required.
name: pro-release

on:
  push:
    branches: [pro/main]
  pull_request:
    branches: [pro/main]
    paths:
      - .github/workflows/pro-release.yml
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to release (defaults to the current HEAD).
        required: false
        type: string
      dry_run:
        description: Plan only; publish neither an image nor a release.
        required: false
        default: false
        type: boolean
      refresh_latest:
        description: Rebuild and republish the `latest` image instead of releasing.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.base.outputs.mode }}
      sha: ${{ steps.base.outputs.sha }}
      version: ${{ steps.base.outputs.version }}
      image: ${{ steps.base.outputs.image }}
      publish: ${{ steps.base.outputs.publish }}
      dry_run: ${{ steps.base.outputs.dry_run }}
      timestamp: ${{ steps.base.outputs.timestamp }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_title: ${{ steps.pr.outputs.pr_title }}
      tag: ${{ steps.final.outputs.tag }}
      primary_tag: ${{ steps.final.outputs.primary_tag }}
      label_version: ${{ steps.final.outputs.label_version }}
      image_tags: ${{ steps.final.outputs.image_tags }}
      concurrency_group: ${{ steps.final.outputs.concurrency_group }}
    steps:
      - name: Resolve mode and checkout ref
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_REFRESH_LATEST: ${{ inputs.refresh_latest }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            push)
              mode="release"
              ;;
            pull_request)
              mode="proof"
              ;;
            schedule)
              mode="latest"
              ;;
            workflow_dispatch)
              if [ "${INPUT_REFRESH_LATEST}" = "true" ]; then
                mode="latest"
              else
                mode="release"
              fi
              ;;
            *)
              echo "::error::unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          case "${mode}" in
            proof)
              if ! [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::pull_request run without a usable head SHA: '${PR_HEAD_SHA}'"
                exit 1
              fi
              checkout_ref="${PR_HEAD_SHA}"
              ;;
            release)
              if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_SHA}" ]; then
                if ! [[ "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::workflow_dispatch input 'sha' must be a full 40-char lowercase hex SHA"
                  exit 1
                fi
                checkout_ref="${INPUT_SHA}"
              else
                checkout_ref="${EVENT_SHA}"
              fi
              ;;
            latest)
              checkout_ref="${EVENT_SHA}"
              ;;
          esac

          {
            echo "mode=${mode}"
            echo "checkout_ref=${checkout_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.checkout_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve SHA, version, image and publish flags
        id: base
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The SHA is the tree that was actually checked out, so the build
          # context, GIT_COMMIT and the image label always agree.
          sha="$(git rev-parse HEAD)"
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve a full SHA from the checkout: '${sha}'"
            exit 1
          fi

          version="$(jq -er '.version | strings | select(length > 0)' package.json)"
          if ! [[ "${version}" =~ ^[0-9] ]]; then
            echo "::error::unexpected package.json version: '${version}'"
            exit 1
          fi

          image="ghcr.io/${REPOSITORY,,}"

          dry_run="${INPUT_DRY_RUN:-false}"
          if [ "${MODE}" = "proof" ]; then
            publish="false"
          else
            publish="true"
          fi
          if [ "${dry_run}" = "true" ]; then
            publish="false"
          fi

          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "mode=${MODE}"
            echo "sha=${sha}"
            echo "version=${version}"
            echo "image=${image}"
            echo "publish=${publish}"
            echo "dry_run=${dry_run}"
            echo "timestamp=${timestamp}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve the merged pull request (release mode only)
        id: pr
        if: steps.base.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          # A merge commit is associated with its pull request asynchronously,
          # so retry the lookup before failing the run.
          selected=""
          for attempt in 1 2 3 4; do
            if pr_json="$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" 2>/dev/null)"; then
              selected="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "pro/main")] | sort_by(.merged_at) | last // empty' <<< "${pr_json}")"
              if [ -n "${selected}" ] && [ "${selected}" != "null" ]; then
                break
              fi
            fi
            selected=""
            if [ "${attempt}" -lt 4 ]; then
              echo "::warning::no merged pro/main pull request for ${SHA} yet (attempt ${attempt}/4); retrying"
              sleep 10
            fi
          done

          if [ -z "${selected}" ] || [ "${selected}" = "null" ]; then
            echo "::error::no merged pull request targeting pro/main found for ${SHA}"
            exit 1
          fi

          {
            echo "pr_number=$(jq -r '.number' <<< "${selected}")"
            echo "pr_title=$(jq -r '.title | gsub("[\\r\\n]"; " ")' <<< "${selected}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Finalize tags and concurrency key
        id: final
        env:
          MODE: ${{ steps.base.outputs.mode }}
          SHA: ${{ steps.base.outputs.sha }}
          VERSION: ${{ steps.base.outputs.version }}
          IMAGE: ${{ steps.base.outputs.image }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          tag=""
          primary_tag=""
          image_tags=""
          label_version="${VERSION}"

          case "${MODE}" in
            release)
              if [ -z "${PR_NUMBER}" ]; then
                echo "::error::release mode without a resolved pull request number"
                exit 1
              fi
              tag="v${VERSION}-pro.pr.${PR_NUMBER}"
              primary_tag="${tag}"
              label_version="${tag}"
              image_tags="${IMAGE}:${tag},${IMAGE}:sha-${short}"
              group="pro-release-${RUN_ID}"
              ;;
            latest)
              primary_tag="latest"
              image_tags="${IMAGE}:latest"
              group="pro-release-latest"
              ;;
            proof)
              group="pro-release-proof-${EVENT_PR_NUMBER}"
              ;;
          esac

          {
            echo "tag=${tag}"
            echo "primary_tag=${primary_tag}"
            echo "label_version=${label_version}"
            echo "image_tags=${image_tags}"
            echo "concurrency_group=${group}"
          } >> "${GITHUB_OUTPUT}"

      - name: Job summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ steps.base.outputs.mode }}
          SHA: ${{ steps.base.outputs.sha }}
          VERSION: ${{ steps.base.outputs.version }}
          PUBLISH: ${{ steps.base.outputs.publish }}
          DRY_RUN: ${{ steps.base.outputs.dry_run }}
          IMAGE: ${{ steps.base.outputs.image }}
          TAG: ${{ steps.final.outputs.tag }}
          IMAGE_TAGS: ${{ steps.final.outputs.image_tags }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          {
            echo "## pro-release plan"
            echo "- Event: ${EVENT_NAME}"
            echo "- Mode: ${MODE}"
            echo "- SHA: ${SHA}"
            echo "- Version: ${VERSION}"
            echo "- Publish: ${PUBLISH}"
            echo "- Dry run: ${DRY_RUN}"
            if [ -n "${PR_NUMBER}" ]; then
              echo "- Merged PR: #${PR_NUMBER}"
            fi
            if [ -n "${TAG}" ]; then
              echo "- Release tag: ${TAG}"
            fi
            if [ -n "${IMAGE_TAGS}" ]; then
              echo "- Image tags: ${IMAGE_TAGS}"
            else
              echo "- Image tags: none (proof build)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ needs.plan.outputs.concurrency_group }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.existing.outputs.skip == 'true' && steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "--- before cleanup ---"
          df -h /
          free -m

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          docker image prune -af || true

          echo "--- after cleanup ---"
          df -h /
          free -m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check for an already published image (idempotency)
        id: existing
        # Release tags are deterministic per (version, PR), so a re-run must not
        # republish. The weekly `latest` refresh is intentionally exempt: it
        # rebuilds even when the revision label already matches, so base image
        # and dependency updates are picked up.
        if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.mode == 'release'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          PRIMARY_TAG: ${{ needs.plan.outputs.primary_tag }}
          EXPECTED_REVISION: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${PRIMARY_TAG}"
          err_file="$(mktemp)"

          # `docker buildx imagetools inspect` exits 1 with "not found" on the
          # registry when the tag is absent, which is the only error we treat
          # as "nothing published yet"; anything else is a hard failure.
          # Method: `docker buildx imagetools inspect --format '{{json .Image}}'`
          # emits a JSON object keyed by platform (e.g. "linux/amd64"), each with
          # a `config.Labels` map. Verified empirically against registry images:
          # jq -r '."linux/amd64".config.Labels."org.opencontainers.image.revision"'.
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>"${err_file}"; then
            revision="$(docker buildx imagetools inspect --format '{{json .Image}}' "${ref}" \
              | jq -r '."linux/amd64".config.Labels."org.opencontainers.image.revision" // empty')
            if [ -z "${revision}" ]; then
              echo "::error::${ref} exists but org.opencontainers.image.revision could not be read; refusing to skip"
              docker buildx imagetools inspect "${ref}"
              exit 1
            fi
            if [ "${revision}" != "${EXPECTED_REVISION}" ]; then
              echo "::error::${ref} already exists for revision ${revision}, expected ${EXPECTED_REVISION}"
              exit 1
            fi
            digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${ref}" | jq -r '.digest // empty')"
            echo "::notice::${ref} already published for ${EXPECTED_REVISION}; skipping the build (digest ${digest})"
            {
              echo "skip=true"
              echo "digest=${digest}"
            } >> "${GITHUB_OUTPUT}"
          else
            if ! grep -qi "not found" "${err_file}"; then
              echo "::error::could not inspect ${ref} on the registry:"
              cat "${err_file}"
              exit 1
            fi
            echo "no existing image at ${ref}; proceeding with the build"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image
        id: build
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.plan.outputs.publish }}
          tags: ${{ needs.plan.outputs.image_tags }}
          outputs: ${{ needs.plan.outputs.mode == 'proof' && format('type=oci,dest={0}/pro-proof/oci,tar=false,compression=gzip,compression-level=1', runner.temp) || '' }}
          build-args: |
            GITHUB_ACTIONS=true
            GIT_COMMIT=${{ needs.plan.outputs.sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ needs.plan.outputs.timestamp }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ needs.plan.outputs.version }}
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex
          labels: |
            org.opencontainers.image.source=https://github.com/theUpsider/OpenClaw-Pro
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.label_version }}
            org.opencontainers.image.created=${{ needs.plan.outputs.timestamp }}

      - name: Report proof build artifacts
        if: needs.plan.outputs.mode == 'proof' && steps.existing.outputs.skip != 'true'
        env:
          PROOF_DIR: ${{ runner.temp }}/pro-proof/oci
        run: |
          set -euo pipefail
          echo "--- proof OCI layout (no push) ---"
          du -sh "${PROOF_DIR}"
          ls -la "${PROOF_DIR}"
          echo "--- disk after proof build ---"
          df -h /

      - name: Job summary
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          SHA: ${{ needs.plan.outputs.sha }}
          IMAGE: ${{ needs.plan.outputs.image }}
          IMAGE_TAGS: ${{ needs.plan.outputs.image_tags }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          SKIPPED: ${{ steps.existing.outputs.skip }}
          DIGEST: ${{ steps.existing.outputs.skip == 'true' && steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## pro-release build"
            echo "- Mode: ${MODE}"
            echo "- SHA: ${SHA}"
            echo "- Image: ${IMAGE}"
            echo "- Publish: ${PUBLISH}"
            if [ -n "${IMAGE_TAGS}" ]; then
              echo "- Tags: ${IMAGE_TAGS}"
            fi
            if [ -n "${DIGEST}" ]; then
              echo "- Digest: ${DIGEST}"
            fi
            if [ "${SKIPPED}" = "true" ]; then
              echo "- Build skipped: the image already carries revision ${SHA}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: publish GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'release' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_TITLE: ${{ needs.plan.outputs.pr_title }}
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          err_file="$(mktemp)"

          if existing="$(gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url 2>"${err_file}")"; then
            target="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null || true)"
            if [ -z "${target}" ]; then
              echo "::error::release ${TAG} exists but its commit could not be resolved"
              exit 1
            fi
            match="false"
            case "${SHA}" in "${target}"*) match="true" ;; esac
            case "${target}" in "${SHA}"*) match="true" ;; esac
            if [ "${match}" != "true" ]; then
              echo "::error::release ${TAG} already exists but targets ${target}, not ${SHA}"
              exit 1
            fi
            echo "::notice::release ${TAG} already exists for ${SHA}; nothing to publish"
            jq -r '"existing release: \(.url)"' <<< "${existing}"
            {
              echo "## pro-release"
              echo "- Release ${TAG} already existed for ${SHA}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if ! grep -qi "not found" "${err_file}"; then
            echo "::error::could not check release ${TAG}:"
            cat "${err_file}"
            exit 1
          fi

          if remote="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)"; then
            echo "::error::tag ${TAG} already exists on the remote (${remote}) without a GitHub release"
            exit 1
          fi

          prev="$(gh release list --repo "${REPOSITORY}" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"

          notes="$(mktemp)"
          {
            echo "Automated release for merged PR #${PR_NUMBER}: ${PR_TITLE}"
            echo
            echo "Commit: ${SHA}"
            echo "Image: ${IMAGE}:${TAG}"
            echo "Image: ${IMAGE}:sha-${short}"
            if [ -n "${DIGEST}" ]; then
              echo "Digest: ${DIGEST}"
            fi
            if [ -n "${prev}" ]; then
              echo "Compare: https://github.com/${REPOSITORY}/compare/${prev}...${SHA}"
            fi
          } > "${notes}"

          gh release create "${TAG}" \
            --repo "${REPOSITORY}" \
            --target "${SHA}" \
            --title "${TAG}" \
            --notes-file "${notes}"

          url="$(gh release view "${TAG}" --repo "${REPOSITORY}" --json url --jq .url)"
          {
            echo "## pro-release"
            echo "- Release: ${url}"
            echo "- Tag: ${TAG}"
            echo "- SHA: ${SHA}"
            echo "- Image: ${IMAGE}:${TAG}"
            if [ -n "${DIGEST}" ]; then
              echo "- Digest: ${DIGEST}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
